name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 12 1 * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[scorer]"
      - run: python -m unittest discover -s tests -p test_caat_scorer.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Python style
        run: |
          python -m pip install ".[dev]"
          ruff check src scripts tests
          ruff format --check src scripts tests
      - name: Check the installed Python API
        run: python -m mypy --strict --python-version 3.10 tests/types/public_api.py
      - name: Check metric properties
        run: python -m unittest discover -s tests/properties -v

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[workflow]"
      - name: Unit tests and benchmark replay
        run: python -m unittest discover -s tests -v
  inspect-logs:
    name: Inspect logs (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: minimum
            python-version: "3.10"
            requirement: inspect-ai==0.3.252
          - sdk: current
            python-version: "3.12"
            requirement: inspect-ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test native Inspect logs
        env:
          INSPECT_REQUIREMENT: ${{ matrix.requirement }}
        run: |
          python -m pip install ".[inspect]" "$INSPECT_REQUIREMENT"
          python -c 'import inspect_ai'
          python -m unittest discover -s tests -p test_caat_inspect.py -v

  tutorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Run the IFEval tutorial notebook
        run: |
          python -m pip install ".[workflow]" nbclient==0.10.2 ipykernel==6.30.1
          jupyter execute examples/ifeval_review.ipynb --timeout=60

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build the documentation site
        run: |
          python -m pip install ".[docs]"
          python scripts/build_docs.py
      - uses: actions/upload-artifact@v7
        with:
          name: caat-docs
          path: replay/docs/site/
          if-no-files-found: error

  audit-action:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: "0.70"
            key: output_key
            status: "0"
          - target: "0.40"
            key: output_key
            status: "1"
          - target: "0.40"
            key: unknown_column
            status: "2"
    steps:
      - uses: actions/checkout@v6
      - name: Audit two graders on the same tickets
        id: audit
        uses: ./
        continue-on-error: ${{ matrix.status != '0' }}
        with:
          predictions: examples/audit/predictions.csv
          grader-files: |
            reference=examples/audit/reference.csv
            rubric=examples/audit/rubric.csv
          output-key-column: ${{ matrix.key }}
          threshold: "0.75"
          risk-target: ${{ matrix.target }}
          report-path: replay/action-audit.json
      - name: Check the action status and report
        env:
          EXPECTED: ${{ matrix.status }}
          STATUS: ${{ steps.audit.outputs.status }}
          REPORT: ${{ steps.audit.outputs.report-path }}
        run: |
          test "$STATUS" = "$EXPECTED"
          if [ "$EXPECTED" = 2 ]; then test -z "$REPORT"; else test -s "$REPORT"; fi

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build and check distributions
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - name: Replay the published ARC-Challenge comparison
        run: |
          python -m pip install dist/*.whl
          python scripts/study_arc.py replay
