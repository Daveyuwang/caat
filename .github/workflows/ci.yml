name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 12 1 * *"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  scorer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install ".[scorer]"
      - run: python -m unittest discover -s tests -p test_caat_scorer.py -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check Python style
        run: |
          python -m pip install ".[dev]"
          ruff check src scripts tests
          ruff format --check src scripts tests
      - name: Check the installed Python API
        run: python -m mypy --strict --python-version 3.10 tests/types/public_api.py
      - name: Check metric properties
        run: python -m unittest discover -s tests/properties -v

  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install ".[workflow]"
      - name: Unit tests and benchmark replay
        run: python -m unittest discover -s tests -v
      - name: README examples
        run: |
          caat --version
          caat plugins --json > /dev/null
          caat evaluate examples/ticket_triage.csv --adapter csv --metric ranking --render json --render-output replay/registered-report.json --id-column ticket_id --prediction-column model_route --reference-column expected_route --score-column confidence --threshold 0.75 > /dev/null
          caat evaluate examples/ticket_triage.csv --id-column ticket_id --prediction-column model_route --reference-column expected_route --score-column confidence --group-column inbox --threshold 0.75 --probability --output-dir replay/tickets --reliability-plot replay/tickets/reliability.svg --html replay/tickets/report.html
          git diff --no-index --ignore-cr-at-eol --exit-code docs/figures/calibration-example.svg replay/tickets/reliability.svg
          caat policy examples/ifeval_graders.csv --score-column mean_token_logprob --correct-column strict_pass --check-column helm_strict_pass --risk-target 0.4 --plot replay/readme-policy.svg
          git diff --no-index --ignore-cr-at-eol --exit-code docs/figures/policy-example.svg replay/readme-policy.svg
          audit_status=0
          caat audit examples/audit/predictions.csv --output-key-column output_key --grader-file reference=examples/audit/reference.csv --grader-file rubric=examples/audit/rubric.csv --threshold 0.75 --risk-target 0.4 --json > /dev/null || audit_status=$?
          test "$audit_status" -eq 1
          caat select examples/ifeval_strict.csv --score-column mean_token_logprob --correct-column strict_pass --thresholds -0.20 -0.35 -0.60 --risk-target 0.4 --rule empirical > /dev/null
          caat features examples/token_scores.jsonl --output replay/token_scores.csv
          caat scores examples/ifeval_graders.csv --score-column mean_token_logprob --correct-column strict_pass --correct-column helm_strict_pass --bootstrap 0 > /dev/null

  inspect-logs:
    name: Inspect logs (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk: minimum
            python-version: "3.10"
            requirement: inspect-ai==0.3.252
          - sdk: current
            python-version: "3.12"
            requirement: inspect-ai
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test native Inspect logs
        env:
          INSPECT_REQUIREMENT: ${{ matrix.requirement }}
        run: |
          python -m pip install ".[inspect]" "$INSPECT_REQUIREMENT"
          python -c 'import inspect_ai'
          python -m unittest discover -s tests -p test_caat_inspect.py -v

  tutorial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Run the IFEval tutorial notebook
        run: |
          python -m pip install ".[workflow]" nbclient==0.10.2 ipykernel==6.30.1
          jupyter execute examples/ifeval_review.ipynb --timeout=60

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build the documentation site
        run: |
          python -m pip install ".[docs]"
          python scripts/build_docs.py
      - uses: actions/upload-artifact@v7
        with:
          name: caat-docs
          path: replay/docs/site/
          if-no-files-found: error

  audit-action:
    name: Grader audit action (${{ matrix.case }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: pass
            threshold: "0.75"
            risk-target: "0.70"
            output-key-column: output_key
            status: "0"
          - case: target-missed
            threshold: "0.75"
            risk-target: "0.40"
            output-key-column: output_key
            status: "1"
          - case: partial-scores
            predictions: replay/action-partial-scores.csv
            threshold: "0.75"
            risk-target: "0.40"
            output-key-column: output_key
            review-missing-scores: "true"
            status: "1"
          - case: invalid-input
            threshold: "0.75"
            risk-target: "0.40"
            output-key-column: missing_key
            status: "2"
          - case: saved-selection
            threshold-report: replay/action-selection.json
            output-key-column: output_key
            status: "1"
          - case: tracked-selection
            threshold-report: replay/action-selection.json
            holdout-confidence: "0.95"
            track-fit-outputs: true
            status: "1"
          - case: reused-fit-output
            threshold-report: replay/action-selection.json
            holdout-confidence: "0.95"
            track-fit-outputs: true
            reuse-fit-output: true
            status: "2"
          - case: fixed-batch-pass
            threshold: "0.75"
            risk-target: "0.75"
            output-key-column: output_key
            holdout-confidence: "0.95"
            accepted-population: "4"
            status: "0"
          - case: fixed-batch-target-missed
            threshold: "0.75"
            risk-target: "0.70"
            output-key-column: output_key
            holdout-confidence: "0.95"
            accepted-population: "4"
            status: "1"
          - case: fixed-batch-invalid-population
            threshold: "0.75"
            risk-target: "0.75"
            output-key-column: output_key
            holdout-confidence: "0.95"
            accepted-population: "2"
            status: "2"
          - case: fixed-batch-decisions
            threshold: "0.75"
            risk-target: "0.65"
            output-key-column: output_key
            holdout-confidence: "0.95"
            batch-decisions: replay/action-decisions.csv
            status: "1"
          - case: fixed-batch-sample-mismatch
            threshold: "0.75"
            risk-target: "0.65"
            output-key-column: output_key
            holdout-confidence: "0.95"
            batch-decisions: replay/action-decisions.csv
            sample-seed: "42"
            status: "2"
    steps:
      - uses: actions/checkout@v6
      - name: Prepare an audit with an unscored output
        if: ${{ matrix.review-missing-scores == 'true' }}
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          Path("replay").mkdir(exist_ok=True)
          with open("examples/audit/predictions.csv", encoding="utf-8", newline="") as source:
              reader = csv.DictReader(source)
              with open("replay/action-partial-scores.csv", "w", encoding="utf-8", newline="") as output:
                  writer = csv.DictWriter(output, reader.fieldnames)
                  writer.writeheader()
                  for row in reader:
                      if row["id"] == "3":
                          row["score"] = ""
                      writer.writerow(row)
          PY
      - name: Prepare the saved cutoff or batch decisions
        if: ${{ matrix.threshold-report || matrix.batch-decisions }}
        env:
          CAAT_THRESHOLD_REPORT: ${{ matrix.threshold-report }}
          CAAT_BATCH_DECISIONS: ${{ matrix.batch-decisions }}
          CAAT_TRACK_FIT_OUTPUTS: ${{ matrix.track-fit-outputs }}
          CAAT_REUSE_FIT_OUTPUT: ${{ matrix.reuse-fit-output }}
        run: |
          mkdir -p replay
          python3 -m venv "$RUNNER_TEMP/caat-action-prepare"
          "$RUNNER_TEMP/caat-action-prepare/bin/python" -m pip install .
          caat="$RUNNER_TEMP/caat-action-prepare/bin/caat"
          if [ -n "$CAAT_BATCH_DECISIONS" ]; then
              "$caat" route examples/audit/predictions.csv --threshold 0.75 --output-key-column output_key --output "$CAAT_BATCH_DECISIONS"
              exit 0
          fi
          python3 - <<'PY'
          import csv
          import os

          row = {"id": "cal-a", "score": "0.80", "correct": "1", "output_key": "cal-answer"}
          if os.environ["CAAT_REUSE_FIT_OUTPUT"] == "true":
              with open("examples/audit/predictions.csv", encoding="utf-8", newline="") as handle:
                  reused = next(csv.DictReader(handle))
              row.update(id=reused["id"], output_key=reused["output_key"])
          with open("replay/action-calibration.csv", "w", encoding="utf-8", newline="") as handle:
              writer = csv.DictWriter(handle, list(row))
              writer.writeheader()
              writer.writerow(row)
          PY
          target=0.40
          tracking=()
          if [ "$CAAT_TRACK_FIT_OUTPUTS" = true ]; then
              target=0.90
              tracking=(--output-key-column output_key --track-fit-outputs)
          fi
          "$caat" select replay/action-calibration.csv --correct-column correct --thresholds 0.75 --risk-target "$target" --rule empirical "${tracking[@]}" --output "$CAAT_THRESHOLD_REPORT"
      - name: Audit the bundled grader exports
        id: audit
        uses: ./
        continue-on-error: ${{ matrix.status != '0' }}
        with:
          predictions: ${{ matrix.predictions || 'examples/audit/predictions.csv' }}
          grader-files: |
            reference=examples/audit/reference.csv
            rubric=examples/audit/rubric.csv
          output-key-column: ${{ matrix.output-key-column }}
          threshold: ${{ matrix.threshold }}
          threshold-report: ${{ matrix.threshold-report }}
          risk-target: ${{ matrix.risk-target }}
          review-missing-scores: ${{ matrix.review-missing-scores }}
          holdout-confidence: ${{ matrix.holdout-confidence }}
          accepted-population: ${{ matrix.accepted-population }}
          batch-decisions: ${{ matrix.batch-decisions }}
          sample-seed: ${{ matrix.sample-seed }}
          report-path: replay/action-audit.json
          disagreements-path: replay/action-disagreements.csv
      - name: Verify the action outcome and artifacts
        if: ${{ always() }}
        env:
          CAAT_EXPECTED_STATUS: ${{ matrix.status }}
          CAAT_STATUS: ${{ steps.audit.outputs.status }}
          CAAT_OUTCOME: ${{ steps.audit.outcome }}
          CAAT_REPORT_PATH: ${{ steps.audit.outputs.report-path }}
          CAAT_DISAGREEMENTS_PATH: ${{ steps.audit.outputs.disagreements-path }}
          CAAT_THRESHOLD_REPORT: ${{ matrix.threshold-report }}
          CAAT_REVIEW_MISSING_SCORES: ${{ matrix.review-missing-scores }}
          CAAT_HOLDOUT_CONFIDENCE: ${{ matrix.holdout-confidence }}
          CAAT_ACCEPTED_POPULATION: ${{ matrix.accepted-population }}
          CAAT_BATCH_DECISIONS: ${{ matrix.batch-decisions }}
        run: |
          python3 - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          expected = os.environ["CAAT_EXPECTED_STATUS"]
          assert os.environ["CAAT_STATUS"] == expected
          assert os.environ["CAAT_OUTCOME"] == ("success" if expected == "0" else "failure")
          report_path = os.environ["CAAT_REPORT_PATH"]
          disagreements_path = os.environ["CAAT_DISAGREEMENTS_PATH"]
          if expected == "2":
              assert not report_path
              assert not disagreements_path
              assert not Path("replay/action-audit.json").exists()
              assert not Path("replay/action-disagreements.csv").exists()
          else:
              assert report_path == "replay/action-audit.json"
              assert disagreements_path == "replay/action-disagreements.csv"
              report = json.loads(Path(report_path).read_text(encoding="utf-8"))
              assert report["threshold"] == 0.75
              assert report["input"]["disagreements_output"] == disagreements_path
              with open(disagreements_path, encoding="utf-8", newline="") as handle:
                  assert list(csv.DictReader(handle)) == [{
                      "id": "2", "score": "0.88", "decision": "accept", "group": "billing",
                      "output_key": "run-a-ticket-2", "grade_reference": "1", "grade_rubric": "0",
                  }]
              assert report["input"].get("threshold_report", "") == os.environ.get("CAAT_THRESHOLD_REPORT", "")
              if confidence := os.environ["CAAT_HOLDOUT_CONFIDENCE"]:
                  assert report["holdout_confidence"] == float(confidence)
                  assert report["input"]["output_key_column"] == "output_key"
                  if os.environ["CAAT_THRESHOLD_REPORT"]:
                      assert report["input"]["fit_outputs_checked"] is True
              if population := os.environ["CAAT_ACCEPTED_POPULATION"]:
                  assert report["accepted_population"] == int(population) == 4
                  assert report["graders"]["reference"]["risk_upper_errors"] == 2
                  assert report["graders"]["rubric"]["risk_upper_errors"] == 3
                  assert report["graders"]["reference"]["risk_upper_bound"] == 0.50
                  assert report["graders"]["rubric"]["risk_upper_bound"] == 0.75
              if batch := os.environ["CAAT_BATCH_DECISIONS"]:
                  assert report["input"]["batch_decisions"] == batch
                  assert report["accepted_population"] == 3
                  assert report["graders"]["reference"]["risk_upper_errors"] == 1
                  assert report["graders"]["rubric"]["risk_upper_errors"] == 2
              partial = os.environ["CAAT_REVIEW_MISSING_SCORES"] == "true"
              if partial:
                  assert report["input"]["review_missing_scores"] is True
                  assert report["scored"] == 4
              expected_errors = (0, 1) if partial else (1, 2)
              for grader, errors in zip(("reference", "rubric"), expected_errors, strict=True):
                  result = report["graders"][grader]
                  assert result["total"] == 5
                  assert result["accepted"] == (2 if partial else 3)
                  assert result["errors"] == errors
                  assert result["meets_target"] == (grader == "reference" or expected == "0")
          PY

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - name: Build and check distributions
        run: |
          python -m pip install build==1.6.1 twine==7.0.0
          python -m build
          python -m twine check --strict dist/*
      - name: Verify the fitted policy across clean training and base installs
        run: python scripts/check_policy_wheel.py dist/*.whl
      - name: Install the wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/caat" --version
          "$RUNNER_TEMP/wheel/bin/python" "$GITHUB_WORKSPACE/scripts/study_winogrande.py" replay
          "$RUNNER_TEMP/wheel/bin/caat" policy "$GITHUB_WORKSPACE/examples/ifeval_graders.csv" --score-column mean_token_logprob --correct-column strict_pass --risk-target 0.4
