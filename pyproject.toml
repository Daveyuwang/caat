[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "caat-annotation"
version = "0.1.0"
description = "Evaluate confidence-based review policies for model annotations"
requires-python = ">=3.10"

[project.scripts]
caat = "caat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
