<text x="348.25" y="92" fill="#172b38" font-size="12" font-weight="600" text-anchor="middle">22.92%</text>
<g><title>helm_strict_pass</title><text x="20" y="140" fill="#172b38" font-size="13" font-weight="400" text-anchor="start">helm_strict_pass</text></g>
<text x="670" y="140" fill="#172b38" font-size="13" font-weight="400" text-anchor="end">45 / 144</text>
