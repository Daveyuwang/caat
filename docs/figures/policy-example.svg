<line x1="540.0" y1="85" x2="540.0" y2="157" stroke="#dbe4e9"/>
<text x="540.0" y="176" fill="#496170" font-size="13" font-weight="400" text-anchor="middle">50%</text>
<g><title>strict_pass</title><text x="20" y="104" fill="#172b38" font-size="13" font-weight="400" text-anchor="start">strict_pass</text></g>
<text x="670" y="104" fill="#172b38" font-size="13" font-weight="400" text-anchor="end">33 / 144</text>
