<line x1="186.0" y1="85" x2="186.0" y2="157" stroke="#dbe4e9"/>
<text x="186.0" y="176" fill="#496170" font-size="13" font-weight="400" text-anchor="middle">0%</text>
<line x1="363.0" y1="85" x2="363.0" y2="157" stroke="#dbe4e9"/>
