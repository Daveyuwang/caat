<line x1="469.2" y1="82" x2="469.2" y2="157" stroke="#b54e00" stroke-dasharray="5 4"/>
<text x="469.2" y="196" fill="#b54e00" font-size="13" font-weight="400" text-anchor="middle">Target 40%</text>
