<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 454" width="840" height="454" role="img" aria-labelledby="title desc">
  <title id="title">How CAAT builds and uses a review policy</title>
  <desc id="desc">Design rows choose a confidence score, calibration rows select a cutoff, and held-out rows check accepted error. The saved policy and a new batch share the same score and cutoff. A confirmed policy can route predictions. A selected cutoff can also define a sample for a batch audit, even if routing was withheld.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#45616c" stroke-width="1.3"/>
    </marker>
    <style>
      text {font-family: "DejaVu Sans", Arial, sans-serif; fill: #172e38}
      .heading {font-size: 20px; font-weight: 700}
      .stage {font-size: 17px; font-weight: 700}
      .note {font-size: 15px; fill: #37545f}
      .cmd {font-family: ui-monospace, Consolas, monospace; font-size: 14px; fill: #315563}
      .wire {fill: none; stroke: #45616c; stroke-width: 1.8; marker-end: url(#arrow)}
    </style>
  </defs>
  <rect width="840" height="454" rx="10" fill="white"/>
  <g id="fit">
    <text class="heading" x="20" y="31">Fit on labeled predictions</text>
    <g fill="#f0f5f6" stroke="#acc1c7">
      <rect x="20" y="52" width="245" height="85" rx="7"/>
      <rect x="298" y="52" width="245" height="85" rx="7"/>
      <rect x="576" y="52" width="244" height="85" rx="7"/>
    </g>
    <text class="note" x="36" y="81">Design rows</text>
    <text class="stage" x="36" y="111">Choose a score</text>
    <path class="wire" d="M265 95 H294"/>
    <text class="note" x="314" y="81">Calibration rows</text>
    <text class="stage" x="314" y="111">Select a cutoff</text>
    <path class="wire" d="M543 95 H572"/>
    <text class="note" x="592" y="81">Held-out rows</text>
    <text class="stage" x="592" y="111">Check accepted error</text>
    <path class="wire" d="M698 137 V185"/>
  </g>
  <g id="apply">
    <text class="heading" x="20" y="177">Use on a new batch</text>
    <rect x="20" y="190" width="245" height="77" rx="7" fill="#fff" stroke="#8ba4af"/>
    <text class="stage" x="36" y="222">New predictions</text>
    <text class="note" x="36" y="248">IDs and scoring inputs</text>
    <path class="wire" d="M265 228 H294"/>
    <rect x="298" y="190" width="245" height="77" rx="7" fill="#e3f2f0" stroke="#60978f"/>
    <text class="stage" x="420.5" y="222" text-anchor="middle">Apply the saved cutoff</text>
    <text class="note" x="420.5" y="248" text-anchor="middle">Identify eligible outputs</text>
    <rect x="576" y="190" width="244" height="77" rx="7" fill="#174b55"/>
    <text x="592" y="222" style="fill:white" class="stage">Saved policy report</text>
    <text x="592" y="248" style="fill:#e3f2f0" class="note">Score, cutoff and check</text>
    <path class="wire" d="M576 228 H547"/>
  </g>
  <g id="decisions">
    <path d="M420.5 267 V289" fill="none" stroke="#45616c" stroke-width="1.8"/>
    <path class="wire" d="M420.5 289 H212 V311"/>
    <path class="wire" d="M420.5 289 H628 V311"/>
    <rect x="20" y="316" width="383" height="122" rx="7" fill="#fff" stroke="#8ba4af"/>
    <text class="stage" x="36" y="346">Route with a confirmed policy</text>
    <text class="note" x="36" y="376">Accept eligible outputs and send the rest</text>
    <text class="note" x="36" y="397">for review.</text>
    <text class="cmd" x="36" y="423">caat route</text>
    <rect x="437" y="316" width="383" height="122" rx="7" fill="#fff" stroke="#8ba4af"/>
    <text class="stage" x="453" y="346">Audit a selected cutoff</text>
    <text class="note" x="453" y="376">Sample eligible outputs and grade them</text>
    <text class="note" x="453" y="397">to check the error target on this batch.</text>
    <text class="cmd" x="453" y="423">caat plan · caat audit-block</text>
  </g>
</svg>
